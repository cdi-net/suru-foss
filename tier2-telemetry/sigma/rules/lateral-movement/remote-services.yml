title: SURU - Remote Services Lateral Movement (DEPRECATED — superseded by suru-lateral-movement.zeek)
id: suru-lm-001
status: deprecated
description: |
  DEPRECATED 2026-07-05. This endpoint-telemetry stub (process-creation
  Image/CommandLine, no live ECS source on this deployment) is superseded by
  the network-observable Zeek NOTICE detection
  tier2-telemetry/zeek/scripts/suru-lateral-movement.zeek, which fires on the
  fan-out of established connections to distinct internal hosts on remote-admin
  ports (SSH/SMB/RDP/VNC) — the same T1021 intent, detectable from data this
  deployment actually ingests. Kept for history; re-author against a real
  endpoint ECS schema only if/when an EDR-agent feed lands and
  process.command_line/process.executable exist (see the suru_endpoint.yml
  stub). It binds to no detector and does not fire today.
