author: SURU Detection Engineering
date: 2026/01/01
modified: 2026/06/24
tags:
  - attack.ta0008
  - attack.t1021
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith:
      - '/ssh'
      - '/scp'
      - '/rsync'
    CommandLine|contains:
      - '-o StrictHostKeyChecking=no'
      - 'ProxyJump'
  condition: selection
