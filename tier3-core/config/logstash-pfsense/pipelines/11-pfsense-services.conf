input {
  pipeline { address => "pfsense-services-pipe" }
}

filter {
  mutate {
    add_field => {
      "[ecs][version]" => "8.0.0"
      "[event][module]" => "pfsense"
      "[observer][product]" => "pfSense"
      "[observer][type]" => "firewall"
      "[service][type]" => "pfsense"
      "[_suru][tier]" => "tier1-perimeter"
    }
  }
  if [program] == "dhcpd" or [program] == "dhclient" {
    mutate { add_field => { "[event][dataset]" => "pfsense.dhcp" "[event][category]" => "network" "[event][kind]" => "event" } }
  } else if [program] == "unbound" or [program] == "dnsmasq" {
    mutate { add_field => { "[event][dataset]" => "pfsense.dns" "[event][category]" => "network" "[event][kind]" => "event" "[network][protocol]" => "dns" } }
    # Parse unbound DNS query line: [PID:THREAD] info: CLIENT_IP FQDN. TYPE CLASS
    # Using dissect (literal field splitting) since grok bracket escaping in Logstash 9 is unreliable.
    # MITRE ATT&CK: TA0011/T1071.004 DNS — resolution requests reveal C2 domains and data exfil.
    # FP: CDN/telemetry (google, apple, windows-update) dominate — expected.
    dissect {
      mapping => { "message" => "[%{_pid}:%{_thread}] info: %{_dns_client_ip} %{_dns_qname} %{_dns_qtype} %{_dns_qclass}" }
      tag_on_failure => ["_unbound_not_query"]
    }
    # Non-query unbound lines (stats, histogram, lifecycle) are forwarded to OpenSearch
    # as event.dataset "unbound.log" so errors and DNSSEC failures remain visible.
    # SEC-057-D: removed drop {} — unbound errors are operationally significant.
    if "_unbound_not_query" in [tags] {
      mutate { replace => { "[event][dataset]" => "unbound.log" } }
    }
    # Promote to ECS paths and strip trailing FQDN dot
    mutate {
      rename => {
        "_dns_client_ip" => "[source][ip]"
        "_dns_qname"     => "[dns][question][name]"
        "_dns_qtype"     => "[dns][question][type]"
        "_dns_qclass"    => "[dns][question][class]"
      }
      remove_field => ["_pid", "_thread"]
    }
    mutate { gsub => [ "[dns][question][name]", "[.]$", "" ] }
  } else if [program] == "openvpn" {
    mutate { add_field => { "[event][dataset]" => "pfsense.openvpn" "[event][category]" => "authentication" "[network][protocol]" => "openvpn" } }
  } else if [program] == "ipsec" or [program] == "charon" or [program] == "strongswan" or [program] == "racoon" {
    mutate { add_field => { "[event][dataset]" => "pfsense.ipsec" "[event][category]" => "network" "[network][protocol]" => "ipsec" } }
  } else if [program] == "sshd" or [program] == "pfsense-auth" or [facility] == "auth" or [facility] == "authpriv" {
    # program == "pfsense-auth": auth.log is read as a file source
    # (program-override "pfsense-auth") after the syslog socket-contention fix —
    # under flags(no-parse) the auth/authpriv facility is not parsed, so route
    # by the program tag the file source sets.
    mutate { add_field => { "[event][dataset]" => "pfsense.auth" "[event][category]" => "authentication" "[event][kind]" => "event" } }
    # The no-parse file source leaves the whole RFC 5424 line in [message],
    # including the true event timestamp — grok it into [event][created] so
    # @timestamp becomes event time, not syslog-ng's receipt time (mirrors
    # 10-pfsense-firewall.conf). Without this the file source's first read
    # backfills the entire existing auth.log with a "now" timestamp. Also lifts
    # the real program (sshguard/sshd) out of the header.
    if [program] == "pfsense-auth" {
      grok {
        match => { "message" => "^<%{POSINT}>[01] %{TIMESTAMP_ISO8601:[event][created]} %{HOSTNAME:[host][hostname]} %{PROG:[process][name]} %{POSINT:[process][pid]:int} - - %{GREEDYDATA:[event][reason]}$" }
        # [host][hostname] is already set (scalar) by the envelope rename in
        # 01-input-syslog-tls.conf. Without overwrite, grok APPENDS its capture to
        # the existing value, producing a duplicated array ["X","X"] — malformed
        # for a keyword-mapped ECS field (host.hostname is singular). overwrite
        # makes grok REPLACE it, keeping the correct scalar (same value, so the
        # only change is array→scalar).
        overwrite => ["[host][hostname]"]
        tag_on_failure => ["_grok_auth_failed"]
      }
    }
  } else if [program] == "php" or [program] == "php-fpm" or [message] =~ /config\.xml|Configuration change|Saved configuration|admin@/ {
    mutate { add_field => { "[event][dataset]" => "pfsense.config" "[event][category]" => "configuration" "[event][type]" => "change" } }
  } else {
    mutate { add_field => { "[event][dataset]" => "pfsense.system" "[event][category]" => "host" "[event][kind]" => "event" } }
  }

  # SEC-012: preserve ingest time then overwrite @timestamp with event time.
  # pfSense service logs (unbound, dhcpd, sshd, etc.) carry no per-event
  # timestamp in the message body; use the syslog-ng envelope `time` field
  # (ISO8601 set by Tier 1 syslog-ng at the moment of log receipt).
  mutate { add_field => { "[event][ingested]" => "%{@timestamp}" } }
  # auth (file source) carries its own event timestamp in the message body, now
  # in [event][created]; use it. Every other service log (unbound/dhcp/etc.)
  # has no per-event timestamp, so it keeps the syslog-ng envelope `time` field.
  # Only auth sets [event][created].
  if [event][created] {
    date {
      match          => ["[event][created]", "ISO8601"]
      target         => "@timestamp"
      tag_on_failure => ["_dateparsefailure"]
    }
  } else {
    date {
      match          => ["time", "ISO8601"]
      target         => "@timestamp"
      tag_on_failure => ["_dateparsefailure"]
    }
  }
  # Idempotent ingest: deterministic document _id = base64(SHA256(message)) of
  # the raw event line, so a re-read of the same source log (an un-rotated
  # eve.json replayed from byte 0 by syslog-ng after a reboot, a log rewritten
  # in place by its producer) UPSERTS the same doc instead of creating a
  # duplicate. [message] is the raw line and is byte-identical on replay, so
  # its SHA256 is a stable natural key. Referenced by document_id in every
  # opensearch output below.
  # TRADE-OFF (accepted): two *genuinely distinct* events with byte-identical
  # raw lines collapse to one doc. Negligible for Suricata EVE / Zeek (their
  # message embeds microsecond ts + flow_id/uid), but pfSense filterlog and
  # pfBlockerNG CSV are second-resolution with no per-line discriminator, so a
  # repeated identical packet within the same second (e.g. an identical scan
  # probe) can merge. That loss is bounded and strictly preferable to the
  # unbounded duplication a byte-0 replay causes.
  fingerprint {
    source              => ["message"]
    target              => "[@metadata][doc_fingerprint]"
    method              => "SHA256"
    base64encode        => true
  }
  # Fail-loud guard: logstash-filter-fingerprint silently no-ops when [message]
  # is absent (no tag_on_failure option), leaving the target unset —
  # document_id would then render as the literal "%{[@metadata][doc_fingerprint]}"
  # and collapse every such doc onto one _id. Tag + quarantine instead of
  # minting a duplicate-only-on-inspection id.
  if ![@metadata][doc_fingerprint] {
    mutate { add_tag => ["_fingerprint_missing_source"] }
  }
}

output {
  if "_dateparsefailure" in [tags] or "_fingerprint_missing_source" in [tags] {
    pipeline { send_to => "quarantine-pipe" }
  } else {
    opensearch {
      ecs_compatibility => "v8"
      hosts => ["https://${OPENSEARCH_HOST}:${OPENSEARCH_PORT}"]
      user => "${OPENSEARCH_USER}"
      password => "${OPENSEARCH_PASSWORD}"
      ssl => true
      cacert => "/usr/share/logstash/certs/root-ca.pem"
      index => "suru-pfsense-services-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][doc_fingerprint]}"
    }
  }
}
