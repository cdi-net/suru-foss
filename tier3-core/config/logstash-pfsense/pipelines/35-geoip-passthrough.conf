# =============================================================================
# Pipeline : geoip (PASSTHROUGH — no enrichment)
# =============================================================================
# Used when no MaxMind GeoLite2 DB is present (MAXMIND_LICENSE_KEY unset). The
# logstash entrypoint copies THIS file to /tmp/geoip-pipeline/35-geoip.conf so
# events routed to geoip-pipe from 10/20/30 still reach OpenSearch — just
# without geo/ASN fields. Keeps ingestion healthy with geo disabled.
# Output block is identical to 35-geoip.conf (kept in lockstep).
# =============================================================================
input {
  pipeline { address => "geoip-pipe" }
}

filter {
  # Idempotent ingest: deterministic document _id = base64(SHA256(message)) of
  # the raw event line, so a re-read of the same source log (an un-rotated
  # eve.json replayed from byte 0 by syslog-ng after a reboot, a log rewritten
  # in place by its producer) UPSERTS the same doc instead of creating a
  # duplicate. [message] is the raw line and is byte-identical on replay, so
  # its SHA256 is a stable natural key. Referenced by document_id in every
  # opensearch output below.
  # TRADE-OFF (accepted): two *genuinely distinct* events with byte-identical
  # raw lines collapse to one doc. Negligible for Suricata EVE / Zeek (their
  # message embeds microsecond ts + flow_id/uid), but pfSense filterlog and
  # pfBlockerNG CSV are second-resolution with no per-line discriminator, so a
  # repeated identical packet within the same second (e.g. an identical scan
  # probe) can merge. That loss is bounded and strictly preferable to the
  # unbounded duplication a byte-0 replay causes.
  fingerprint {
    source              => ["message"]
    target              => "[@metadata][doc_fingerprint]"
    method              => "SHA256"
    base64encode        => true
  }
  # Fail-loud guard: logstash-filter-fingerprint silently no-ops when [message]
  # is absent (no tag_on_failure option), leaving the target unset —
  # document_id would then render as the literal "%{[@metadata][doc_fingerprint]}"
  # and collapse every such doc onto one _id. Tag + quarantine instead of
  # minting a duplicate-only-on-inspection id.
  if ![@metadata][doc_fingerprint] {
    mutate { add_tag => ["_fingerprint_missing_source"] }
  }
}

output {
  if "_fingerprint_missing_source" in [tags] {
    pipeline { send_to => "quarantine-pipe" }
  } else if [event][module] == "suricata" {
    opensearch {
      ecs_compatibility => "v8"
      hosts    => ["https://${OPENSEARCH_HOST}:${OPENSEARCH_PORT}"]
      user     => "${OPENSEARCH_USER}"
      password => "${OPENSEARCH_PASSWORD}"
      ssl      => true
      cacert   => "/usr/share/logstash/certs/root-ca.pem"
      index    => "suru-suricata-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][doc_fingerprint]}"
    }
  } else if [event][module] == "zeek" {
    opensearch {
      ecs_compatibility => "v8"
      hosts    => ["https://${OPENSEARCH_HOST}:${OPENSEARCH_PORT}"]
      user     => "${OPENSEARCH_USER}"
      password => "${OPENSEARCH_PASSWORD}"
      ssl      => true
      cacert   => "/usr/share/logstash/certs/root-ca.pem"
      index    => "suru-zeek-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][doc_fingerprint]}"
    }
  } else {
    opensearch {
      ecs_compatibility => "v8"
      hosts    => ["https://${OPENSEARCH_HOST}:${OPENSEARCH_PORT}"]
      user     => "${OPENSEARCH_USER}"
      password => "${OPENSEARCH_PASSWORD}"
      ssl      => true
      cacert   => "/usr/share/logstash/certs/root-ca.pem"
      index    => "suru-pfsense-firewall-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][doc_fingerprint]}"
    }
  }
}
